# Render Blueprint: free web service, database on Neon (free Postgres).
# Dashboard → New → Blueprint → pick this repository.
# When prompted, paste Neon's pooled and direct connection strings (`neon env pull` writes both to .env).
# To upgrade later: change plan to "starter" (no sleeping) – no code changes needed.
services:
  - type: web
    name: aryavysya-connect
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /en
    envVars:
      - key: DATABASE_URL # Neon pooled connection string (host ends in -pooler)
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct connection string, used for migrations
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FAMILY_EDIT_GENERATIONS
        value: "5"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: MSG91_AUTH_KEY # MSG91 → Authkey; phone sign-in stays hidden until both are set
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID # MSG91 → OTP → Templates (DLT-approved, contains ##OTP##)
        sync: false
      # Field encryption: "k1:<32 random bytes, base64>" – back the key up; then run `npm run encryption:backfill`
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: FIELD_ENCRYPTION_CURRENT
        sync: false
      # Shown on the privacy notice, terms and grievance pages (Data Fiduciary and Grievance Officer)
      - key: LEGAL_ORG_NAME
        sync: false
      - key: LEGAL_ORG_ADDRESS
        sync: false
      - key: GRIEVANCE_OFFICER_NAME
        sync: false
      - key: GRIEVANCE_EMAIL
        sync: false
      - key: GRIEVANCE_PHONE # optional
        sync: false
