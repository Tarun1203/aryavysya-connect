# Render Blueprint: free web service, database on Neon (free Postgres).
# Dashboard → New → Blueprint → pick this repository.
# When prompted, paste the Neon connection string into DATABASE_URL.
# To upgrade later: change plan to "starter" (no sleeping) – no code changes needed.
services:
  - type: web
    name: aryavysya-connect
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /en
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FAMILY_EDIT_GENERATIONS
        value: "5"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
