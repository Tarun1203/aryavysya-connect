# Render Blueprint: one web service + one managed Postgres.
# Dashboard → New → Blueprint → pick this repository.
databases:
  - name: vamsha-db
    databaseName: vamsha
    user: vamsha
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: arya-vysya-tree
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /en
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vamsha-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: FAMILY_EDIT_GENERATIONS
        value: "5"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
